<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APERTOR</title>
  <style>
    :root {
      --mocha-100: #F5EBE6;
      --mocha-600: #8E6955;
      --accent-rose: #E1B2B6;
    }

    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 200vh;
      display: grid;
      place-items: start center;
      background: linear-gradient(180deg, #FDFBF9 0%, var(--mocha-100) 100%);
      padding-top: 14vh;
    }

    .aperture-wrap {
      width: 220px;
      height: 220px;
      border: 1px solid rgba(142, 105, 85, 0.25);
      border-radius: 9999px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.55);
      box-shadow: 0 16px 30px rgba(61, 42, 33, 0.08);
      backdrop-filter: blur(2px);
    }

    .aperture-logo {
      width: 150px;
      height: 150px;
      color: var(--accent-rose);
    }

    .aperture-logo path,
    .aperture-logo circle {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .aperture-logo path { stroke-width: 2; }

    .aperture-logo circle { stroke-width: 1.6; }
  </style>
</head>
<body>
  <div class="aperture-wrap" aria-label="סמל צמצם">
    <svg class="aperture-logo" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M32 8 L45 16 L37 27 L24 27 Z"></path>
      <path d="M45 16 L56 30 L43 36 L37 27 Z"></path>
      <path d="M56 30 L52 47 L38 45 L43 36 Z"></path>
      <path d="M52 47 L36 57 L29 44 L38 45 Z"></path>
      <path d="M36 57 L18 53 L21 39 L29 44 Z"></path>
      <path d="M18 53 L8 38 L20 31 L21 39 Z"></path>
      <path d="M8 38 L10 21 L24 23 L20 31 Z"></path>
      <path d="M10 21 L23 9 L31 20 L24 23 Z"></path>
      <circle cx="32" cy="32" r="10"></circle>
    </svg>
  </div>

</body>
</html>
