<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APERTOR</title>
  <style>
    :root {
      --mocha-100: #F5EBE6;
      --mocha-600: #8E6955;
      --accent-rose: #E1B2B6;
      --open-progress: 0;
    }

    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 200vh;
      display: grid;
      place-items: start center;
      background: linear-gradient(180deg, #FDFBF9 0%, var(--mocha-100) 100%);
      padding-top: 14vh;
    }

    .aperture-wrap {
      width: 220px;
      height: 220px;
      border: 1px solid rgba(142, 105, 85, 0.25);
      border-radius: 9999px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.55);
      box-shadow: 0 16px 30px rgba(61, 42, 33, 0.08);
      backdrop-filter: blur(2px);
    }

    .aperture-logo {
      width: 150px;
      height: 150px;
      color: var(--accent-rose);
    }

    .aperture-logo path,
    .aperture-logo circle {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .aperture-logo path {
      stroke-width: 2;
      transform-box: fill-box;
      transform-origin: 50% 50%;
      transform: rotate(calc(var(--blade-angle, 0deg) * var(--open-progress)));
      transition: transform .35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .aperture-logo circle { stroke-width: 1.6; }
    .aperture-logo path:nth-of-type(1) { --blade-angle: -16deg; }
    .aperture-logo path:nth-of-type(2) { --blade-angle: -12deg; }
    .aperture-logo path:nth-of-type(3) { --blade-angle: -8deg; }
    .aperture-logo path:nth-of-type(4) { --blade-angle: -4deg; }
    .aperture-logo path:nth-of-type(5) { --blade-angle: 4deg; }
    .aperture-logo path:nth-of-type(6) { --blade-angle: 8deg; }
    .aperture-logo path:nth-of-type(7) { --blade-angle: 12deg; }
    .aperture-logo path:nth-of-type(8) { --blade-angle: 16deg; }
  </style>
</head>
<body>
  <div class="aperture-wrap" aria-label="סמל צמצם">
    <svg class="aperture-logo" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M32 8 L45 16 L37 27 L24 27 Z"></path>
      <path d="M45 16 L56 30 L43 36 L37 27 Z"></path>
      <path d="M56 30 L52 47 L38 45 L43 36 Z"></path>
      <path d="M52 47 L36 57 L29 44 L38 45 Z"></path>
      <path d="M36 57 L18 53 L21 39 L29 44 Z"></path>
      <path d="M18 53 L8 38 L20 31 L21 39 Z"></path>
      <path d="M8 38 L10 21 L24 23 L20 31 Z"></path>
      <path d="M10 21 L23 9 L31 20 L24 23 Z"></path>
      <circle cx="32" cy="32" r="10"></circle>
    </svg>
  </div>

  <script>
    const logo = document.querySelector('.aperture-logo');
    const update = () => {
      const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
      const progress = Math.min(1, window.scrollY / Math.min(maxScroll, window.innerHeight * 1.2));
      logo.style.setProperty('--open-progress', progress.toFixed(3));
    };
    update();
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
  </script>
</body>
</html>
