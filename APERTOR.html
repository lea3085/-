<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APERTOR SVG</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #FDFBF9;
      color: #3D2A21;
      font-family: sans-serif;
    }
    .logo-wrap {
      width: 220px;
      text-align: center;
    }
    .aperture-logo {
      width: 180px;
      height: 180px;
      color: #E1B2B6;
    }
    .aperture-logo path,
    .aperture-logo circle {
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .aperture-logo path { stroke-width: 2; }
    .aperture-logo circle { stroke-width: 1.6; }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <svg class="aperture-logo" viewBox="0 0 64 64" aria-label="Aperture logo">
      <path d="M32 8 L45 16 L37 27 L24 27 Z"></path>
      <path d="M45 16 L56 30 L43 36 L37 27 Z"></path>
      <path d="M56 30 L52 47 L38 45 L43 36 Z"></path>
      <path d="M52 47 L36 57 L29 44 L38 45 Z"></path>
      <path d="M36 57 L18 53 L21 39 L29 44 Z"></path>
      <path d="M18 53 L8 38 L20 31 L21 39 Z"></path>
      <path d="M8 38 L10 21 L24 23 L20 31 Z"></path>
      <path d="M10 21 L23 9 L31 20 L24 23 Z"></path>
      <circle cx="32" cy="32" r="10"></circle>
    </svg>
  </div>
</body>
</html>
